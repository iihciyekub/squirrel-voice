name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    environment: production-release
    timeout-minutes: 75
    env:
      MAC_CSC_NAME: ${{ vars.MAC_CSC_NAME || 'Yongjian Li (2NLAH5MYH8)' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm version and Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Import Developer ID and App Store Connect API key
        env:
          MAC_CSC_P12_BASE64: ${{ secrets.MAC_CSC_P12_BASE64 }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_P12_BASE64 MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID_SECRET APPLE_API_ISSUER_SECRET; do
            [[ -n "${!name:-}" ]] || { echo "Missing production-release secret: $name" >&2; exit 1; }
          done

          P12_PATH="$RUNNER_TEMP/squirrel-voice-developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/squirrel-voice-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MAC_CSC_P12_BASE64" | base64 --decode > "$P12_PATH"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$P12_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          APP_IDENTITY="Developer ID Application: $MAC_CSC_NAME"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APP_IDENTITY"

          INSTALLER_IDENTITY="$(security find-identity -v -p basic "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)"

          {
            echo "SQUIRREL_VOICE_SIGN_IDENTITY=$APP_IDENTITY"
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
            if [[ -n "$INSTALLER_IDENTITY" ]]; then
              echo "SQUIRREL_VOICE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
              echo "HAS_INSTALLER_IDENTITY=1"
            else
              echo "HAS_INSTALLER_IDENTITY=0"
            fi
          } >> "$GITHUB_ENV"

      - name: Install native build dependency
        run: brew install boost

      - name: Build Developer ID signed app
        env:
          SQUIRREL_REBUILD_DEPS: "1"
          BOOST_ROOT: /opt/homebrew/opt/boost
        run: ./scripts/build-squirrel.sh

      - name: Notarize and staple app
        run: ./scripts/notarize-app.sh

      - name: Create release ZIP
        run: ./scripts/package-zip.sh

      - name: Build and notarize PKG when Installer identity is available
        run: |
          set -euo pipefail
          if [[ "$HAS_INSTALLER_IDENTITY" == "1" ]]; then
            ./scripts/package-pkg.sh
            ./scripts/notarize-pkg.sh
            SQUIRREL_VOICE_RELEASE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            SQUIRREL_VOICE_HOMEPAGE="https://github.com/${GITHUB_REPOSITORY}" \
              ./scripts/render-cask.sh
          else
            echo "Developer ID Installer identity is not present in MAC_CSC_P12_BASE64; skipping publishable PKG."
          fi

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APP="build/Squirrel-src/build/Build/Products/Release/Squirrel Voice.app"
          ZIP="dist/SquirrelVoice-$VERSION-arm64.zip"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          test -f "$ZIP"
          shasum -a 256 "$ZIP" > "dist/SHA256SUMS.txt"
          if [[ -f "dist/SquirrelVoice-$VERSION-arm64.pkg" ]]; then
            pkgutil --check-signature "dist/SquirrelVoice-$VERSION-arm64.pkg"
            xcrun stapler validate "dist/SquirrelVoice-$VERSION-arm64.pkg"
            shasum -a 256 "dist/SquirrelVoice-$VERSION-arm64.pkg" >> "dist/SHA256SUMS.txt"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "$TAG" --force
          fi
          assets=("dist/SquirrelVoice-$VERSION-arm64.zip" "dist/SHA256SUMS.txt")
          [[ -f "dist/SquirrelVoice-$VERSION-arm64.pkg" ]] && assets+=("dist/SquirrelVoice-$VERSION-arm64.pkg")
          [[ -f "dist/squirrel-voice.rb" ]] && assets+=("dist/squirrel-voice.rb")
          gh release create "$TAG" "${assets[@]}" \
            --title "Squirrel Voice $VERSION" \
            --notes "Squirrel Voice $VERSION for Apple Silicon macOS. Models are not bundled."

